<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Магазин</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=B612:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header__brand">
        <img src="static/book-logo.svg" alt="Book Shop logo" width="48" height="48">
        <div>
          <h1 class="header__title">Book Shop</h1>
          <p class="header__subtitle">The best book shop ever!</p>
        </div>
      </div>
      <button class="header__cart" type="button" id="open-order">
        <img src="static/cart.svg" alt="Корзина" width="24" height="24">
        <span>Сделать заказ</span>
      </button>
    </header>

  <main>
    
    <section class="catalog">
      <h2 class="catalog__title">Книги</h2>
      <div class="catalog__grid">
      </div>
    </section>

  </main>

    <dialog class="order" id="order-modal">
      <h2 class="order__title" id="order-title">Оформление заказа</h2>
      <ul class="order__list" id="order-list"></ul>
      <p class="order__total">Итого: <span id="order-total">0</span> ₽</p>
      <form class="order-form" id="order-form" action="#" method="post">
        <label class="order-form__field">
          <span class="order-form__label">Имя</span>
          <input class="order-form__input" type="text" name="firstName" required>
        </label>
        <label class="order-form__field">
          <span class="order-form__label">Фамилия</span>
          <input class="order-form__input" type="text" name="lastName" required>
        </label>
        <label class="order-form__field">
          <span class="order-form__label">Адрес доставки</span>
          <input class="order-form__input" type="text" name="address" required>
        </label>
        <label class="order-form__field">
          <span class="order-form__label">Контактный номер телефона</span>
          <input class="order-form__input" type="tel" name="phone" required>
        </label>
        <button class="order-form__submit" id="order-submit" type="submit" disabled>Создать заказ</button>
      </form>
      <p class="order__success" id="order-success" hidden>Заказ создан!</p>
    </dialog>
  </div>

  <!-- The order is important. Some variables are defined in books.js and used in orderForm.js  -->
  <script src="js/books.js"></script>
  <script src="js/orderForm.js"></script>
</body>
</html>
