<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Магазин</title>
  <link rel="stylesheet" href="styles/style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header__brand">
        <img src="static/book-logo.svg" alt="Book Shop logo" width="48" height="48">
        <div>
          <h1 class="header__title">Book Shop</h1>
          <p class="header__subtitle">The best book shop ever!</p>
        </div>
      </div>
      <button class="header__cart" type="button" id="open-order">
        <img src="static/cart.svg" alt="Корзина" width="24" height="24">
        <span>Сделать заказ</span>
      </button>
    </header>

  <main>
    <!-- Just mock yet -->
    <section class="catalog">
      <h2 class="catalog__title">Книги</h2>
      <div class="catalog__grid">
        <article class="product-card">
          <div class="product-card__cover"></div>
          <h3 class="product-card__title">Мастер и Маргарита</h3>
          <p class="product-card__author">Михаил Булгаков</p>
          <p class="product-card__price">800 ₽</p>
          <button class="product-card__button" type="button">Добавить в корзину</button>
        </article>
        <article class="product-card">
          <div class="product-card__cover"></div>
          <h3 class="product-card__title">Преступление и наказание</h3>
          <p class="product-card__author">Фёдор Достоевский</p>
          <p class="product-card__price">700 ₽</p>
          <button class="product-card__button" type="button">Добавить в корзину</button>
        </article>
        <article class="product-card">
          <div class="product-card__cover"></div>
          <h3 class="product-card__title">Война и мир</h3>
          <p class="product-card__author">Лев Толстой</p>
          <p class="product-card__price">1200 ₽</p>
          <button class="product-card__button" type="button">Добавить в корзину</button>
        </article>
        <article class="product-card">
          <div class="product-card__cover"></div>
          <h3 class="product-card__title">Тихий Дон</h3>
          <p class="product-card__author">Михаил Шолохов</p>
          <p class="product-card__price">950 ₽</p>
          <button class="product-card__button" type="button">Добавить в корзину</button>
        </article>
      </div>
    </section>
    
  </main>

    <dialog class="order" id="order-modal">
      <h2 class="order__title" id="order-title">Оформление заказа</h2>
      <form class="order-form" action="#" method="post">
        <label class="order-form__field">
          <span class="order-form__label">Имя</span>
          <input class="order-form__input" type="text" name="firstName" required>
        </label>
        <label class="order-form__field">
          <span class="order-form__label">Фамилия</span>
          <input class="order-form__input" type="text" name="lastName" required>
        </label>
        <label class="order-form__field">
          <span class="order-form__label">Адрес доставки</span>
          <input class="order-form__input" type="text" name="address" required>
        </label>
        <label class="order-form__field">
          <span class="order-form__label">Контактный номер телефона</span>
          <input class="order-form__input" type="tel" name="phone" required>
        </label>
        <button class="order-form__submit" type="submit">Создать заказ</button>
      </form>
    </dialog>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
